  spacegroups: [225, 216]
  thermoelectric: p-type, 700–1000 K
  summary: >
    Above ~400 K, Cu ions are liquid-like in an fcc Se framework
    ("phonon-liquid electron-crystal"), which gives very low thermal conductivity.
  highlights:
    - property: Peak zT
      value: ≈ 1.5 at 1000 K
