  caveats: >
    The high-temperature β phase has disordered Cu. Ordered DFT cells are
    approximants; the low-temperature α phase is a complex superstructure.
  structure_ambiguity: >
    In the thermoelectric β phase, Cu is spread over partially occupied sites in an
    fcc Se framework. Every DFT cell is an ordered approximant that picks one Cu
    arrangement, so the structure shown is a model, not the measured structure.
  refs:
    - 10.1038/nmat3273

